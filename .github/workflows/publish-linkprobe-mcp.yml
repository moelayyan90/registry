name: Publish LinkProbe to MCP Registry

on:
  workflow_dispatch:
  push:
    paths:
      - 'linkprobe/server.json'
      - '.github/workflows/publish-linkprobe-mcp.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate linkprobe/server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish LinkProbe
        run: ./mcp-publisher publish linkprobe/server.json
